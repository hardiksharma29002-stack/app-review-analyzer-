services:
  - type: web
    name: app-review-insights-backend
    env: python
    buildCommand: cd app-review-insights && pip install -r requirements.txt
    startCommand: cd app-review-insights && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
